name: Nightshift Pilot Contract Tests

on:
  push:
    branches:
      - feature/v0.4-nightshift-pilot
    paths:
      - 'scripts/nightshift.py'
      - 'tests/test_nightshift.py'
      - 'config/nightshift.example.json'
      - 'config/backlog.example.json'
      - 'systemd/mk-nightshift@.*'
      - '.github/workflows/nightshift-contract-tests.yml'
  pull_request:
    paths:
      - 'scripts/nightshift.py'
      - 'tests/test_nightshift.py'
      - 'config/nightshift.example.json'
      - 'config/backlog.example.json'
      - 'systemd/mk-nightshift@.*'
      - '.github/workflows/nightshift-contract-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real Git-worktree behavioral tests (mocked coding CLIs)
        run: python3 -m unittest discover -s tests -p 'test_nightshift.py' -v
      - name: Syntax check and example validation
        run: |
          python3 -m py_compile scripts/nightshift.py
          python3 -m json.tool config/nightshift.example.json >/dev/null
          python3 -m json.tool config/backlog.example.json >/dev/null
